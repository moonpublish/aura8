    function CommunitySportsView({ theme, currentRegion, setCurrentRegion, showToast, setTimeline }) {
      const isDark = theme === 'dark';
      const [selectedSport, setSelectedSport] = useState('badminton');
      const [selectedVenue, setSelectedVenue] = useState(null);
      const [bookingOption, setBookingOption] = useState('community_only');
      const [selectedTrainer, setSelectedTrainer] = useState(null);
      const [selectedTimeSlot, setSelectedTimeSlot] = useState(null);
      const [badmintonMode, setBadmintonMode] = useState('double');

      const venues = STATIC_VENUES;
      const thaiTrainers = STATIC_TRAINERS;
      const hourlySlots = STATIC_HOURLY_SLOTS;

      const handleSelectVenue = (v) => {
        setSelectedVenue(v);
      };

      const calculatePrice = () => {
        if (!selectedVenue) return { venueShare: 0, trainerFee: 0, total: 0 };
        let venueShare = 0;
        if (selectedVenue.type === 'private') {
          const players = selectedSport === 'badminton' ? (badmintonMode === 'double' ? 4 : 2) : 6;
          venueShare = Math.round((selectedVenue.baseCost / players) * 1.6);
        }
        const trainerFee = (bookingOption === 'with_trainer' && selectedTrainer) ? selectedTrainer.rate : 0;
        return { venueShare, trainerFee, total: venueShare + trainerFee };
      };

      const prices = calculatePrice();

      const handleConfirmBooking = () => {
        if (!selectedVenue || !selectedTimeSlot) {
          showToast('กรุณาเลือกสถานที่และช่วงเวลาที่ต้องการจอง', 'warning');
          return;
        }
        if (bookingOption === 'with_trainer' && !selectedTrainer) {
          showToast('กรุณาเลือกโค้ชผู้ฝึกสอน', 'warning');
          return;
        }

        const bookingTitle = `${selectedSport === 'badminton' ? '🏸 แบดมินตัน' : '🏃 วิ่ง'} @ ${selectedVenue.name} (${selectedTimeSlot})`;
        setTimeline(prev => [
          ...prev,
          {
            id: Date.now(),
            time: selectedTimeSlot.split(' - ')[0] + ' น.',
            title: bookingTitle,
            type: 'workout',
            completed: false,
            tag: `฿${prices.total}`
          }
        ]);

        showToast(`จองคลาสสำเร็จ! ยอดชำระ ฿${prices.total} (เพิ่มลงไทม์ไลน์แล้ว)`);
        setSelectedVenue(null);
        setSelectedTimeSlot(null);
        setSelectedTrainer(null);
      };

      const currentVenues = (venues[selectedSport] && venues[selectedSport][currentRegion]) || [];

      return (
        <div className="space-y-5 animate-fadeIn w-full">
          {/* Header */}
          <div className="p-5 sm:p-6 rounded-3xl bg-gradient-to-r from-blue-700 via-indigo-800 to-slate-900 border border-white/20 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
            <div>
              <span className="text-[10px] font-black uppercase tracking-wider bg-lime-400 text-slate-950 px-2.5 py-0.5 rounded-full">
                Sports Community Hub
              </span>

        setScanning(true);

          setScanProgress((prev) => {
            if (prev >= 100) {
              clearInterval(interval);
              setScanning(false);
              setUserStats(s => ({ ...s, lastBodyFat: 18.9, muscleMass: 42.8 }));
              showToast('สแกนสรีระ AI 3D สำเร็จ! ข้อมูลอัปเดตแล้ว ✨');
              return 100;
            }
            return prev + 25;
          });
        }, 400);
      };

      const handlePurchaseCourse = (courseId) => {
        if (!purchasedCourseIds.includes(courseId)) {
          setPurchasedCourseIds(prev => [...prev, courseId]);
        }
        setPaymentStep('unlocked');
        showToast('ชำระเงินสำเร็จ! ปลดล็อกคอร์สเรียนเรียบร้อยแล้ว 🎉');

    // ==========================================
    function FoodScannerView({ theme, userStats, setUserStats, setTimeline, showToast }) {
      const isDark = theme === 'dark';
      const [analyzing, setAnalyzing] = useState(false);
      const [analyzedFood, setAnalyzedFood] = useState(null);
      const [foodFilter, setFoodFilter] = useState('ทั้งหมด');

      const sampleFoods = STATIC_SAMPLE_FOODS;
      const categories = ['ทั้งหมด', 'ลดไขมัน/ลีน', 'โปรตีนสูง', 'โลว์คาร์บ/คีโต', 'เมนูสุขภาพไทย'];

      const filteredFoods = sampleFoods.filter(f => foodFilter === 'ทั้งหมด' || f.category === foodFilter);

      const handleSelectSample = (food) => {
        setAnalyzing(true);
        setAnalyzedFood(null);
        setTimeout(() => {
          setAnalyzing(false);
          setAnalyzedFood(food);

      };

      const handleLogFood = () => {
        if (!analyzedFood) return;

        setUserStats(prev => ({
          ...prev,
          calories: prev.calories + analyzedFood.calories,
          protein: prev.protein + analyzedFood.protein,
          carbs: prev.carbs + analyzedFood.carbs,
          fat: prev.fat + analyzedFood.fat
        }));

        setTimeline(prev => [
          ...prev,
          {
            id: Date.now(),
            time: 'เมื่อสักครู่',
            title: `บันทึกอาหาร: ${analyzedFood.name}`,
            type: 'food',
            completed: true,
            tag: `${analyzedFood.calories} kcal`
          }
        ]);

        showToast(`บันทึก ${analyzedFood.name} (${analyzedFood.calories} kcal) แล้ว!`);
        setAnalyzedFood(null);
      };

      return (
        <div className="space-y-5 animate-fadeIn w-full">
          <div className="bg-gradient-to-r from-emerald-600 via-teal-700 to-indigo-800 rounded-3xl p-5 sm:p-6 text-white shadow-xl flex items-center justify-between border border-white/20">
            <div>
              <span className="bg-white/20 text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider text-lime-400">
                AI Food Vision
              </span>

              <p className="text-xs text-teal-100 mt-0.5">วิเคราะห์ดัชนีน้ำตาลและโภชนาการอัตโนมัติ</p>
            </div>
            <Icon name="camera" className="w-8 h-8 text-lime-400 flex-shrink-0" />
          </div>

          {/* Category Filters */}
          <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar w-full">
            {categories.map((cat) => (
              <button
                key={cat}
                onClick={() => setFoodFilter(cat)}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border ${
                  foodFilter === cat ? 'bg-lime-400 text-slate-950 border-lime-400 font-black' : isDark ? 'bg-white/5 border-white/10 text-slate-400' : 'bg-white border-slate-200 text-slate-600'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Sample Dishes Grid */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
            {filteredFoods.map((item) => (
              <div 
                key={item.id}
                onClick={() => handleSelectSample(item)}
                className={`rounded-2xl overflow-hidden border cursor-pointer transition-all group ${
                  isDark ? 'bg-slate-900/60 border-white/10 hover:border-lime-400' : 'bg-white border-slate-200 shadow-sm'
                }`}
              >
                <div className="aspect-[16/11] relative overflow-hidden bg-slate-900">
                  <img src={item.image} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                  <span className="absolute bottom-1.5 right-1.5 bg-black/70 text-lime-400 text-[10px] font-black px-1.5 py-0.5 rounded">
                    {item.calories} kcal
                  </span>
                </div>
                <div className="p-2.5">
                  <p className="text-xs font-bold truncate group-hover:text-lime-400">{item.name}</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">โปรตีน {item.protein}g • คาร์บ {item.carbs}g</p>
                </div>
              </div>
            ))}
          </div>

          {analyzing && (
            <div className={`p-6 rounded-3xl border text-center space-y-2 ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
              <div className="w-8 h-8 border-3 border-lime-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p className="text-xs font-bold">AI กำลังวิเคราะห์โภชนาการและดัชนีน้ำตาล...</p>
            </div>
          )}

          {/* FIXED POPUP: Uses fixed inset-0 w-full h-full overflow-hidden */}
          {analyzedFood && !analyzing && (
            <div className={`fixed inset-0 z-50 flex flex-col w-full h-full overflow-hidden transition-all duration-200 animate-fadeIn ${
              isDark ? 'bg-slate-950 text-white' : 'bg-slate-50 text-slate-900'
            }`}>
              
              <div className={`flex-shrink-0 px-4 sm:px-6 py-3 border-b flex items-center justify-between shadow-md ${
                isDark ? 'bg-slate-950/95 border-slate-800' : 'bg-white/95 border-slate-200'
              }`}>
                <button 
                  onClick={() => setAnalyzedFood(null)}

                >
                  <Icon name="chevronLeft" className="w-4 h-4 stroke-[3]" /> ย้อนกลับ
                </button>
                <div className="text-xs sm:text-sm font-black truncate max-w-[200px]">{analyzedFood.name}</div>
                <button onClick={() => setAnalyzedFood(null)} className="p-1.5 rounded-xl hover:bg-white/10">
                  <Icon name="x" className="w-5 h-5 text-slate-400" />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto w-full max-w-2xl mx-auto p-4 sm:p-6 space-y-5 min-w-0">
                <div className="relative rounded-2xl overflow-hidden aspect-[16/9] bg-slate-900 border border-white/10 shadow-lg">
                  <img src={analyzedFood.image} alt={analyzedFood.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent flex items-end p-4 justify-between">
                    <div>
                      <span className="text-[10px] font-bold text-lime-400 bg-black/60 px-2 py-0.5 rounded-full">{analyzedFood.category}</span>
                      <h3 className="text-lg font-black text-white mt-1">{analyzedFood.name}</h3>
                    </div>
                    <div className="text-right">
                      <div className="text-2xl font-black text-lime-400">{analyzedFood.calories}</div>
                      <div className="text-[9px] text-slate-300 uppercase">kcal</div>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 w-full">
                  <div className="bg-emerald-500/15 p-3 rounded-2xl border border-emerald-500/30 text-center">
                    <div className="text-[11px] text-emerald-400 font-bold">โปรตีน</div>
                    <div className="text-lg font-black mt-0.5">{analyzedFood.protein}g</div>
                  </div>
                  <div className="bg-indigo-500/15 p-3 rounded-2xl border border-indigo-500/30 text-center">
                    <div className="text-[11px] text-indigo-400 font-bold">คาร์บ</div>
                    <div className="text-lg font-black mt-0.5">{analyzedFood.carbs}g</div>
                  </div>
                  <div className="bg-amber-500/15 p-3 rounded-2xl border border-amber-500/30 text-center">
                    <div className="text-[11px] text-amber-400 font-bold">ไขมัน</div>
                    <div className="text-lg font-black mt-0.5">{analyzedFood.fat}g</div>
                  </div>
                  <div className="bg-cyan-500/15 p-3 rounded-2xl border border-cyan-500/30 text-center">
                    <div className="text-[11px] text-cyan-400 font-bold">ดัชนีน้ำตาล</div>
                    <div className="text-sm font-black mt-1">{analyzedFood.glycemicIndex}</div>
                  </div>
                </div>

                <div className={`p-4 rounded-2xl border text-xs leading-relaxed ${
                  isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                }`}>
                  <span className="text-lime-400 font-bold">คำแนะนำโภชนาการ: </span>
                  {analyzedFood.alignment}
                </div>
              </div>

              <div className={`flex-shrink-0 p-3 sm:p-4 border-t ${
                isDark ? 'bg-slate-950/95 border-slate-800' : 'bg-white/95 border-slate-200'
              }`}>
                <div className="max-w-2xl mx-auto flex items-center justify-between gap-3">
                  <button onClick={() => setAnalyzedFood(null)} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-white/10">ยกเลิก</button>
                  <button onClick={handleLogFood} className="flex-1 py-2.5 bg-lime-400 hover:bg-lime-500 text-slate-950 font-black text-xs rounded-xl shadow-lg">บันทึกลงตารางประจำวัน</button>
                </div>
              </div>

            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. MEDICATION TRACKER VIEW
    // ==========================================
    function MedicationTrackerView({ theme, showToast }) {
      const isDark = theme === 'dark';
      const [medsList, setMedsList] = useState(STATIC_DEFAULT_MEDS);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [newMedForm, setNewMedForm] = useState({
        name: '', category: 'ยาประจำตัว', dosage: '1 เม็ด', dosageAmount: 1, timing: 'หลังอาหารเช้า', time: '08:00 น.', stock: 30, minStock: 5, notes: ''
      });
      const [selectedMedsForCheck, setSelectedMedsForCheck] = useState(['Metformin', 'สมุนไพรเซนต์จอห์นเวิร์ต']);
      const [interactionResult, setInteractionResult] = useState(null);
      const [cartCount, setCartCount] = useState(0);

      const handleTakeMedication = (id, name, amount) => {
        setMedsList(prev => prev.map(m => m.id === id ? { ...m, stock: Math.max(0, m.stock - (amount || 1)) } : m));
        showToast(`บันทึกการทานยา ${name} เรียบร้อย! 💊`);
      };

      const handleSaveMedication = (e) => {
        e.preventDefault();
        if (!newMedForm.name.trim()) return;
        const created = {
          id: Date.now(),
          ...newMedForm,
          image: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&q=80&w=300'
        };
        setMedsList([created, ...medsList]);
        setIsAddModalOpen(false);
        showToast(`เพิ่ม ${newMedForm.name} ลงตารางแจ้งเตือนแล้ว!`);
      };

      const checkInteractions = () => {
        if (selectedMedsForCheck.includes('Metformin') && selectedMedsForCheck.includes('สมุนไพรเซนต์จอห์นเวิร์ต')) {
          setInteractionResult({
            type: 'warning',
            title: 'แจ้งเตือน: พบปฏิกิริยาระดับปานกลาง!',
            msg: 'สมุนไพรเซนต์จอห์นเวิร์ตอาจกระทบประสิทธิภาพการคุมระดับน้ำตาลของ Metformin'
          });
        } else {
          setInteractionResult({
            type: 'safe',
            title: 'ปลอดภัย: ไม่พบอันตรกิริยารุนแรง',
            msg: 'สามารถรับประทานร่วมกันได้ตามขนาดการใช้งานปกติ'
          });
        }
      };

      return (
        <div className="space-y-5 animate-fadeIn w-full">
          <div className="bg-gradient-to-r from-teal-800 via-indigo-900 to-slate-900 rounded-3xl p-5 sm:p-6 text-white shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border border-white/20">
            <div>
              <span className="bg-lime-400 text-slate-950 text-xs px-3 py-1 rounded-full font-black uppercase">
                Smart Medication Schedule
              </span>
              <h2 className="text-xl sm:text-2xl font-bold mt-2">ตารางเวลาทานยาและเวชภัณฑ์</h2>
              <p className="text-teal-100 text-xs mt-1">เตือนทานยา ตัดสต็อก และสั่งซื้อเวชภัณฑ์ส่งด่วนใน 1 ชม.</p>
            </div>
            <button 
              onClick={() => setIsAddModalOpen(true)}
              className="px-4 py-2 bg-lime-400 hover:bg-lime-500 text-slate-950 font-black text-xs rounded-xl shadow-lg flex items-center gap-1.5"
            >
              <Icon name="plus" className="w-4 h-4 stroke-[2.5]" /> + เพิ่มยาใหม่
            </button>
          </div>

          {/* Meds List */}
          <div className="space-y-3 w-full">
            {medsList.map((med) => {
              const isLow = med.stock <= med.minStock;
              return (
                <div 
                  key={med.id}
                  className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                    isDark ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900 shadow-sm'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <img src={med.image} alt={med.name} className="w-12 h-12 rounded-xl object-cover flex-shrink-0" />
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-bold">{med.name}</span>
                        <span className="text-[10px] bg-lime-400 text-slate-950 font-black px-1.5 py-0.2 rounded">{med.dosage}</span>
                      </div>
                      <div className="text-xs text-slate-400 mt-0.5">⏱️ {med.time} • {med.timing}</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-3 self-end sm:self-center">
                    <div className="text-right">
                      <div className={`text-xs font-black ${isLow ? 'text-amber-400' : 'text-slate-400'}`}>เหลือ {med.stock} หน่วย</div>
                      {isLow && <div className="text-[10px] text-amber-400 font-bold">ยาใกล้หมด</div>}
                    </div>
                    <button 
                      onClick={() => handleTakeMedication(med.id, med.name, med.dosageAmount)}
                      disabled={med.stock <= 0}
                      className="px-3.5 py-1.5 bg-lime-400 text-slate-950 text-xs font-black rounded-xl hover:bg-lime-500 disabled:opacity-50"
                    >
                      ทานเรียบร้อย
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* AI Drug Interaction Checker */}
          <div className="bg-gradient-to-br from-slate-900 to-indigo-950 rounded-3xl p-5 text-white space-y-3 border border-white/20">
            <h3 className="text-sm font-bold flex items-center gap-1.5 text-lime-400">
              <Icon name="shieldCheck" className="w-4 h-4" /> AI ตรวจจับปฏิกิริยาระหว่างยา
            </h3>
            <div className="flex flex-wrap gap-2">
              {['Metformin', 'สมุนไพรเซนต์จอห์นเวิร์ต', 'วิตามิน D3', 'Omega-3'].map(item => (
                <button
                  key={item}
                  onClick={() => setSelectedMedsForCheck(prev => prev.includes(item) ? prev.filter(i => i !== item) : [...prev, item])}
                  className={`px-3 py-1 rounded-xl text-xs font-bold border transition-all ${
                    selectedMedsForCheck.includes(item) ? 'bg-lime-400 text-slate-950 border-lime-400 font-black' : 'bg-white/10 text-slate-300 border-white/10'
                  }`}
                >
                  {item}
                </button>
              ))}
            </div>
            <button onClick={checkInteractions} className="w-full py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl shadow-md">
              ตรวจปฏิกิริยาระหว่างยา
            </button>
            {interactionResult && (
              <div className={`p-3 rounded-xl text-xs ${interactionResult.type === 'warning' ? 'bg-amber-500/20 text-amber-200' : 'bg-emerald-500/20 text-emerald-200'}`}>
                <div className="font-bold">{interactionResult.title}</div>
                <div>{interactionResult.msg}</div>
              </div>
            )}
          </div>

          {/* Marketplace */}
          <div className="space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="text-sm font-bold">ร้านเวชภัณฑ์จัดส่งด่วนใน 1 ชั่วโมง</h3>
              <div className="text-xs text-lime-400 font-bold">ตะกร้า: {cartCount} ชิ้น</div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
              {STATIC_MARKET_PRODUCTS.map((prod, i) => (
                <div key={i} className={`p-4 rounded-2xl border flex flex-col justify-between ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
                  <div>
                    <span className="text-[10px] font-black bg-lime-400 text-slate-950 px-2 py-0.5 rounded-full">{prod.tag}</span>
                    <h4 className="text-xs sm:text-sm font-bold mt-1.5">{prod.name}</h4>
                    <p className="text-[11px] text-slate-400 mt-0.5">{prod.properties}</p>
                  </div>
                  <div className="pt-2 mt-2 border-t border-white/10 flex justify-between items-center">
                    <span className="text-sm font-black text-lime-400">{prod.price}</span>
                    <button 
                      onClick={() => { setCartCount(c => c + 1); showToast(`เพิ่ม ${prod.name} ลงตะกร้าแล้ว! 🛒`); }}
                      className="px-3 py-1 bg-lime-400 text-slate-950 text-xs font-black rounded-xl hover:bg-lime-500"

                      สั่งซื้อส่งด่วน
                    </button>
                  </div>
                </div>
              ))}

          {/* Add Med Modal */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-3.5 text-white">
                <h3 className="text-base font-bold">เพิ่มยาใหม่เข้าตารางแจ้งเตือน</h3>
                <form onSubmit={handleSaveMedication} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1">ชื่อยา *</label>
                    <input 
                      type="text" 
                      required 
                      value={newMedForm.name} 
                      onChange={e => setNewMedForm({ ...newMedForm, name: e.target.value })} 
                      className="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white" 
                      placeholder="เช่น Amoxicillin 500mg" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 mb-1">ขนาดรับประทาน</label>
                      <input 
                        type="text" 
                        value={newMedForm.dosage} 
                        onChange={e => setNewMedForm({ ...newMedForm, dosage: e.target.value })} 
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">เวลาทาน</label>
                      <input 
                        type="text" 
                        value={newMedForm.time} 
                        onChange={e => setNewMedForm({ ...newMedForm, time: e.target.value })} 
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white" 
                      />
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-lime-400 text-slate-950 font-black rounded-xl">บันทึก</button>
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-4 py-2.5 bg-white/10 rounded-xl">ยกเลิก</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. TELEMEDICINE VIEW
    // ==========================================
    function TelemedicineView({ theme, showToast }) {
      const isDark = theme === 'dark';
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'สวัสดีครับคุณศิรินทร์ ผมคือระบบคัดกรองอาการเบื้องต้น Aura AI ปัจจุบันคุณมีอาการไม่สบายหรือต้องการปรึกษาแพทย์เฉพาะทางด้านใดครับ?' }
      ]);
      const [input, setInput] = useState('');
      const [appointmentType, setAppointmentType] = useState('visit');
      const [activeDate, setActiveDate] = useState('14 Tue');
      const [activeTime, setActiveTime] = useState('13:00');

      const handleSend = () => {
        if (!input.trim()) return;
        const text = input;
        setMessages(prev => [...prev, { sender: 'user', text }]);
        setInput('');

        setTimeout(() => {
          setMessages(prev => [
            ...prev,
            { sender: 'ai', text: 'ประเมินจากอาการที่ระบุ จัดอยู่ในกลุ่มสีเขียว (ความรุนแรงต่ำ) หากต้องการนัดหมายแพทย์เฉพาะทาง คุณสามารถกดปุ่ม "Appointment" กับ พญ. เอมิลี่ ปีเตอร์สัน ได้ทันทีครับ' }
          ]);
        }, 500);
      };

      return (
        <div className="space-y-5 animate-fadeIn w-full">
          {/* Appointment Hero Card */}
          <div className="bg-gradient-to-b from-[#2B47FC] via-[#3730A3] to-[#1E1B4B] rounded-3xl p-5 sm:p-6 text-white shadow-xl border border-white/20 space-y-4">
            <div className="flex items-center justify-between gap-4">
              <div>
                <span className="text-xs font-medium text-indigo-200">Cardiologist</span>
                <h2 className="text-2xl font-black mt-0.5">Emily Peterson</h2>
                <div className="flex items-center gap-1.5 mt-1.5">
                  <span className="w-2 h-2 rounded-full bg-lime-400"></span>
                  <span className="text-xs text-lime-400 font-bold">Online พร้อมให้คำปรึกษา</span>
                </div>
              </div>
              <img 
                src="https://images.unsplash.com/photo-1594824813583-36c1e57c6b90?auto=format&fit=crop&q=80&w=260" 
                alt="Doctor" 
                className="w-24 h-24 rounded-2xl object-cover border-2 border-white/30 shadow-lg"
              />
            </div>

            {/* Appointment Booking Panel */}
            <div className="bg-white text-slate-900 rounded-2xl p-4 shadow-lg space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <button 
                  onClick={() => setAppointmentType('visit')}
                  className={`py-2 px-3 rounded-xl text-xs font-bold ${appointmentType === 'visit' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                >
                  Visit
                </button>
                <button 
                  onClick={() => setAppointmentType('virtual')}
                  className={`py-2 px-3 rounded-xl text-xs font-bold ${appointmentType === 'virtual' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                >
                  Virtual
                </button>
              </div>

              <div className="flex justify-between gap-1 overflow-x-auto text-xs no-scrollbar">
                {['12 Sun', '13 Mon', '14 Tue', '15 Wed', '16 Thu'].map(d => (
                  <button
                    key={d}
                    onClick={() => setActiveDate(d)}
                    className={`py-1.5 px-2.5 rounded-lg font-bold whitespace-nowrap ${activeDate === d ? 'bg-lime-400 text-slate-950 font-black' : 'bg-slate-100 text-slate-600'}`}
                  >
                    {d}
                  </button>
                ))}
              </div>

              <div className="flex justify-between gap-1 overflow-x-auto text-xs no-scrollbar">
                {['10:00', '11:00', '12:00', '13:00', '14:00'].map(t => (
                  <button
                    key={t}
                    onClick={() => setActiveTime(t)}
                    className={`py-1.5 px-2.5 rounded-lg font-bold whitespace-nowrap ${activeTime === t ? 'bg-lime-400 text-slate-950 font-black' : 'bg-slate-100 text-slate-600'}`}
                  >
                    {t}
                  </button>
                ))}
              </div>

              <button 
                onClick={() => showToast(`นัดหมายแพทย์สำเร็จ: ${activeDate} เวลา ${activeTime} น. 🩺`)}
                className="w-full py-3 px-4 rounded-xl bg-slate-900 text-white font-black text-xs shadow-md flex items-center justify-between"
              >
                <span>Make an Appointment</span>
                <span className="text-lime-400 font-black">›››</span>
              </button>
            </div>
          </div>

          {/* AI Clinical Symptom Chat Assistant */}
          <div className={`p-4 rounded-3xl border space-y-3 ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
            <div className="text-xs font-bold text-lime-400 flex items-center gap-1.5">
              <Icon name="sparkles" className="w-3.5 h-3.5" /> Aura Clinical AI Symptom Checker
            </div>

            <div className="space-y-2 max-h-44 overflow-y-auto pr-1">
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[85%] p-2.5 rounded-xl text-xs ${
                    m.sender === 'user' ? 'bg-lime-400 text-slate-950 font-bold' : 'bg-white/10 text-white'
                  }`}>
                    {m.text}
                  </div>
                </div>
              ))}
            </div>

            <div className="flex gap-2 pt-1 border-t border-white/10">
              <input 
                type="text" 
                placeholder="ระบุอาการของคุณ..."
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                className="flex-1 text-xs px-3 py-2 rounded-xl bg-white/10 border border-white/15 text-white placeholder-slate-400 focus:outline-none focus:border-lime-400"
              />
              <button onClick={handleSend} className="px-3.5 py-2 rounded-xl bg-lime-400 text-slate-950 text-xs font-bold">
                <Icon name="send" className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Mount App ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
